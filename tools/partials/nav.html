<header class="site-nav">
  <div class="site-nav__row">
    <a href="{{homeHref}}" class="brand-mark" aria-label="{{nav.homeAria}}">
      <img class="brand-mark__logo" src="/images/logo-56.png" alt="" width="28" height="28" />
      <span class="brand-mark__text">Velora</span>
    </a>
    <nav class="site-nav__links" aria-label="{{nav.primaryAria}}">
      <a href="{{coachHref}}">{{nav.coach}}</a>
      <a href="{{guidesHref}}">{{nav.guides}}</a>
      <a href="{{privacyHref}}">{{nav.privacy}}</a>
    </nav>
    <div class="site-nav__actions">
      <div class="lang-switch" role="group" aria-label="{{nav.langGroupAria}}">
        <a href="{{langHref.en}}" hreflang="en" lang="en" data-locale="en" aria-current="false">{{nav.langEn}}</a>
        <a href="{{langHref.tr}}" hreflang="tr" lang="tr" data-locale="tr" aria-current="false">{{nav.langTr}}</a>
      </div>
      <a class="site-nav__cta" href="{{storeUrlNav}}" target="_blank" rel="noopener noreferrer">{{nav.getApp}}</a>
    </div>
  </div>
</header>
